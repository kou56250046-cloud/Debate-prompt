<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オフラインです — 討論卓</title>
<meta name="theme-color" content="#7C3AED">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<script>/* テーマ先読み：本体スクリプトより先に data-theme を当ててちらつきを防ぐ */
(function(){try{var t=localStorage.getItem("debate-app:theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<style>
  .offline-head{padding:96px 0 0}
  .offline-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
</style>
</head>
<body>

<div class="wrap">

<header class="offline-head reveal">
  <div class="eyebrow e4">Offline</div>
  <h1>いまは<em>つながっていません</em>。</h1>
  <p class="lede">討論の記録はこの端末の中に保存されているので、一度開いたページはオフラインのままでも読めます。まだ開いたことのないページだけ、接続が戻るまで待ってください。</p>
  <div class="offline-links">
    <a class="btn btn-primary" href="index.html">記録の一覧へ</a>
    <a class="btn btn-ghost" href="compose.html">新しい討論をつくる</a>
    <button class="btn btn-ghost" type="button" onclick="location.reload()">再読み込み</button>
  </div>
</header>

</div>

<script src="assets/pwa.js"></script>
</body>
</html>
