<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>討論卓 — 記録</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1115">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="討論卓">
<script>/* テーマ先読み：本体スクリプトより先に data-theme を当ててちらつきを防ぐ */
(function(){try{var t=localStorage.getItem("debate-app:theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<style>
  .toplinks{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
  .tagcloud{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tagcloud button{appearance:none;cursor:pointer;background:var(--c5s);border:1px solid transparent;
    color:var(--ink-2);border-radius:999px;padding:3px 11px;font-size:12px;font-family:var(--sans)}
  .tagcloud button[aria-pressed="true"]{background:var(--c4);color:var(--on-accent);font-weight:700}
  .backup{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
  #importFile{display:none}
  .count{font-size:13px;color:var(--ink-3);margin-top:14px;display:flex;
    justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}

  /* ビュー切替：記録 / 未完タスク / 未解決論点 */
  .views{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;
    overflow-x:auto;scrollbar-width:none}
  .views::-webkit-scrollbar{display:none}
  .viewtab{appearance:none;cursor:pointer;background:none;color:var(--ink-3);border:0;
    border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 15px 9px;
    font-family:var(--sans);font-size:14px;white-space:nowrap;transition:all .18s;
    display:flex;align-items:baseline;gap:7px}
  .viewtab:hover{color:var(--c4)}
  .viewtab b{font-family:var(--mono);font-size:11px;font-weight:700}
  .viewtab[aria-selected="true"]{color:var(--c5);border-bottom-color:var(--c5);font-weight:700}
  .viewtab:focus-visible{outline:2px solid var(--c2);outline-offset:-3px}

  .groupbox{margin-bottom:18px}
  .grouphead{appearance:none;cursor:pointer;width:100%;text-align:left;background:var(--surface);
    color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:11px 14px;
    font-family:var(--sans);font-size:14px;display:flex;align-items:center;gap:10px}
  .grouphead:hover{border-color:var(--c4)}
  .grouphead .n{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grouphead .c{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none}
  .grouphead .a{color:var(--ink-3);flex:none;transition:transform .18s}
  .groupbox[data-open="false"] .grouphead .a{transform:rotate(-90deg)}
  .groupbody{margin-top:10px}
  .groupbox[data-open="false"] .groupbody{display:none}

  /* 横断一覧（タスク・未解決論点） */
  .xlist{display:flex;flex-direction:column;gap:9px}
  .xrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    display:flex;gap:12px;align-items:flex-start}
  .xrow.done .t{opacity:.45;text-decoration:line-through}
  .xrow input[type=checkbox]{margin-top:3px;flex:none;width:16px;height:16px;accent-color:var(--c5)}
  .xrow .b{flex:1;min-width:0}
  .xrow .t{font-size:14px;line-height:1.7}
  .xrow .s{font-size:12px;color:var(--ink-3);margin-top:5px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .xrow .s a{color:var(--c4);text-decoration:none;border-bottom:1px solid transparent}
  .xrow .s a:hover{border-bottom-color:var(--c4)}
  .xrow .im{font-family:var(--mono);font-size:10.5px;font-weight:700;flex:none;
    padding:3px 8px;border-radius:5px;background:var(--c5s);color:var(--ink-2)}
  .xrow .im.hi{background:var(--danger-s);color:var(--danger)}
</style>
</head>
<body>

<div class="wrap-wide">

<header class="reveal">
  <div class="eyebrow e4">Dashboard</div>
  <h1>これまでの<em>討論</em>。</h1>
  <p class="lede">議題ごとの論点・対立・積み残しがここに溜まります。会議の前に、同じ議題の過去回を開いてから臨んでください。</p>
  <div class="toplinks">
    <a class="btn btn-primary" href="compose.html">新しい討論をつくる</a>
    <a class="btn btn-ghost" href="import.html">討論を取り込む</a>
  </div>
</header>

<div id="firstNotice"></div>

<section class="tight reveal">
  <div class="stats" id="stats"></div>
</section>

<section class="tight reveal">
  <div class="views" role="tablist" aria-label="表示">
    <button class="viewtab" type="button" id="v-rec" role="tab" aria-selected="true">記録 <b id="nRec"></b></button>
    <button class="viewtab" type="button" id="v-task" role="tab" aria-selected="false">未完タスク <b id="nTask"></b></button>
    <button class="viewtab" type="button" id="v-issue" role="tab" aria-selected="false">未解決の論点 <b id="nIssue"></b></button>
  </div>

  <div class="toolbar">
    <div class="grow"><input type="search" id="q" placeholder="タイトル・議題・論点・想定問答を検索"></div>
    <div style="flex:0 0 150px"><select id="fMode"><option value="">すべてのモード</option></select></div>
    <div style="flex:0 0 180px"><select id="fCat"><option value="">すべてのカテゴリ</option></select></div>
    <div style="flex:0 0 170px"><select id="fSort">
      <option value="date">新しい順</option>
      <option value="conflict">対立の多い順</option>
      <option value="task">未完タスクの多い順</option>
      <option value="title">タイトル順</option>
    </select></div>
  </div>
  <div class="tagcloud" id="tagCloud"></div>
  <p class="count">
    <span id="count"></span>
    <label id="groupToggle" style="display:flex;align-items:center;gap:7px;cursor:pointer">
      <input type="checkbox" id="fGroup" style="width:15px;height:15px;accent-color:var(--c5)">
      議題ごとにまとめる
    </label>
  </p>
  <div id="list"></div>
</section>

<section class="tight reveal">
  <div class="eyebrow e5">Backup</div>
  <h2 style="font-size:20px">バックアップ</h2>
  <p class="sub" style="font-size:14px">記録はこの端末のブラウザにだけ保存されています。ブラウザのデータを消すと消えます。別の端末で見たいときも、ここで書き出したファイルを持っていってください。</p>
  <div class="backup">
    <button class="btn btn-ghost" id="expBtn">JSON で書き出す</button>
    <button class="btn btn-ghost" id="impBtn">ファイルから読み込む</button>
    <input type="file" id="importFile" accept=".json,application/json">
    <span class="hint" id="usage"></span>
  </div>
  <div id="backupNotice"></div>
</section>

<footer>
  <span>討論卓 — LOCAL ONLY / NO ACCOUNT / NO SERVER</span>
  <span><a href="compose.html">討論をつくる</a> ／ <a href="import.html">取り込む</a></span>
</footer>
</div>

<script src="assets/catalog.js"></script>
<script src="assets/schema.js"></script>
<script src="assets/prompt.js"></script>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script src="samples/sample-record.js"></script>
<script>
(function(){
"use strict";
var DA = window.DA, $ = DA.$;

var activeTag = "";
var view = "rec";            // rec | task | issue
var openGroups = {};         // 議題グループの開閉

function catColor(label){
  var i = 0;
  for(var k=0;k<DA.CATS.length;k++){ if(DA.CATS[k].label === label){ i = k; break; } }
  return DA.seatHex((i % 4) + 1);
}

/* ---------- 統計 ---------- */
function renderStats(items){
  var box = $("stats"); box.innerHTML = "";
  var conflicts = 0, tasksOpen = 0, objections = 0;
  items.forEach(function(e){
    conflicts += e.conflicts || 0;
    tasksOpen += e.tasksOpen || 0;
    objections += e.objections || 0;
  });
  var rows = [
    { k:"RECORDS", v:items.length, u:"件", cls:"" },
    { k:"OPEN CONFLICTS", v:conflicts, u:"論点", cls: conflicts ? "danger" : "" },
    { k:"OPEN TASKS", v:tasksOpen, u:"件", cls: tasksOpen ? "warn" : "" },
    { k:"想定問答", v:objections, u:"件", cls:"" }
  ];
  rows.forEach(function(r){
    box.appendChild(DA.el("div.stat" + (r.cls ? "." + r.cls : ""), null, [
      DA.el("div.k", { text:r.k }),
      DA.el("div.v", null, [ document.createTextNode(String(r.v)), DA.el("small", { text:r.u }) ])
    ]));
  });
}

/* ---------- タグ ---------- */
function renderTags(all){
  var counts = {};
  all.forEach(function(e){
    (e.tags || []).forEach(function(t){ counts[t] = (counts[t] || 0) + 1; });
  });
  var top = Object.keys(counts).sort(function(a,b){ return counts[b] - counts[a]; }).slice(0, 12);
  var box = $("tagCloud"); box.innerHTML = "";
  if(!top.length) return;
  top.forEach(function(t){
    var b = DA.el("button", { type:"button", text:t + " " + counts[t],
      "aria-pressed": activeTag === t ? "true" : "false" });
    b.addEventListener("click", function(){
      activeTag = (activeTag === t) ? "" : t;
      render();
    });
    box.appendChild(b);
  });
}

/* ---------- 一覧 ---------- */
function matches(e, q){
  if(!q) return true;
  var hay = [e.title, e.topic, e.category, (e.tags || []).join(" ")].join(" ").toLowerCase();
  if(hay.indexOf(q) >= 0) return true;
  var rec = DA.store.get(e.id);
  if(!rec) return false;
  var deep = [
    rec.issues.map(function(i){ return i.label + " " + i.question + " " + i.unresolved; }).join(" "),
    rec.objections.map(function(o){ return o.voice + " " + o.from + " " + o.counter + " " + o.evidence; }).join(" "),
    rec.risks.map(function(r){ return r.text + " " + r.mitigation; }).join(" "),
    rec.ideas.map(function(i){ return i.text; }).join(" "),
    rec.decisions.map(function(d){ return d.text; }).join(" "),
    rec.tasks.map(function(t){ return t.text + " " + t.owner; }).join(" "),
    rec.summary.recommendation
  ].join(" ");
  return deep.toLowerCase().indexOf(q) >= 0;
}

function render(){
  var all = DA.store.list();
  renderTags(all);

  var q = ($("q").value || "").trim().toLowerCase();
  var cat = $("fCat").value;
  var sort = $("fSort").value;
  var md = $("fMode").value;

  var items = all.filter(function(e){
    if(cat && e.category !== cat) return false;
    if(md && (e.mode || "debate") !== md) return false;
    if(activeTag && (e.tags || []).indexOf(activeTag) < 0) return false;
    return matches(e, q);
  });

  if(sort === "conflict") items.sort(function(a,b){ return (b.conflicts||0) - (a.conflicts||0); });
  else if(sort === "task") items.sort(function(a,b){ return (b.tasksOpen||0) - (a.tasksOpen||0); });
  else if(sort === "title") items.sort(function(a,b){ return String(a.title).localeCompare(String(b.title), "ja"); });

  renderStats(all);
  $("count").textContent = all.length
    ? (items.length === all.length ? all.length + " 件" : items.length + " / " + all.length + " 件")
    : "";
  $("nRec").textContent = items.length ? String(items.length) : "";
  $("nTask").textContent = countTasks(items) || "";
  $("nIssue").textContent = countIssues(items) || "";
  $("groupToggle").style.display = view === "rec" ? "flex" : "none";

  var host = $("list"); host.innerHTML = "";

  if(all.length && view !== "rec"){
    (view === "task" ? renderTaskView : renderIssueView)(host, items);
    return;
  }

  if(!all.length){
    host.appendChild(DA.el("div.empty", null, [
      DA.el("h3", { text:"まだ記録がありません" }),
      DA.el("p", { text:"討論をつくって ChatGPT にかけ、その結果を取り込むとここに並びます。先に完成形を見たい場合はサンプルを読み込んでください。" }),
      DA.el("div", { style:"display:flex;gap:10px;justify-content:center;flex-wrap:wrap" }, [
        DA.el("a.btn.btn-primary", { href:"compose.html", text:"討論をつくる" }),
        (function(){
          var b = DA.el("button.btn.btn-ghost", { type:"button", text:"サンプルを読み込む" });
          b.addEventListener("click", loadSample);
          return b;
        })()
      ])
    ]));
    return;
  }
  if(!items.length){
    host.appendChild(DA.el("div.empty", null, [ DA.el("p", { text:"条件に合う記録がありません。" }) ]));
    return;
  }

  if($("fGroup").checked) renderGrouped(host, items);
  else host.appendChild(recGrid(items));
}

/* ---------- 記録カード ---------- */
function recCard(e){
  var meta = DA.el("div.meta", null, [
    DA.el("span", { text: DA.fmtDate(e.date) }),
    DA.el("span", { text: DA.findMode(e.mode).tag }),
    e.category ? DA.el("span", { text: e.category }) : null,
    e.sessions ? DA.el("span", { text:"続き" + e.sessions }) : null
  ]);
  var m = DA.el("div.m", null, [
    DA.el("span", null, [ DA.el("b", { text:String(e.issues || 0) }), document.createTextNode(" 論点") ]),
    DA.el("span", null, [ DA.el("b", { text:String(e.conflicts || 0) }), document.createTextNode(" 対立") ]),
    DA.el("span", null, [ DA.el("b", { text:String(e.objections || 0) }), document.createTextNode(" 想定問答") ]),
    (e.tasksAll ? DA.el("span", null, [
      DA.el("b", { text: e.tasksOpen + "/" + e.tasksAll }), document.createTextNode(" タスク")
    ]) : null)
  ]);
  var tags = DA.el("div.tagrow");
  (e.tags || []).forEach(function(t){ tags.appendChild(DA.el("span.tag", { text:t })); });

  var card = DA.el("a.rec", { href:"record.html?id=" + encodeURIComponent(e.id) }, [
    meta, DA.el("h3", { text:e.title }), m, tags
  ]);
  card.style.borderLeftColor = catColor(e.category);
  return card;
}
function recGrid(items){
  var grid = DA.el("div.reclist");
  items.forEach(function(e){ grid.appendChild(recCard(e)); });
  return grid;
}

/* ---------- 議題ごとのまとめ ---------- */
/* 同じ議題を何度も回したものを1つにたたむ。議題が空ならタイトルで寄せる */
function topicKey(e){
  var s = (e.topic || e.title || "").replace(/[\s　、。・,.「」『』（）()【】\-—…!?！？]/g, "");
  return s.slice(0, 40).toLowerCase() || ("__" + e.id);
}
function renderGrouped(host, items){
  var order = [], map = {};
  items.forEach(function(e){
    var k = topicKey(e);
    if(!map[k]){ map[k] = []; order.push(k); }
    map[k].push(e);
  });
  order.forEach(function(k){
    var g = map[k];
    if(g.length === 1){ host.appendChild(recGrid(g)); return; }

    var open = openGroups[k] !== false;
    var box = DA.el("div.groupbox", { "data-open": open ? "true" : "false" });
    var head = DA.el("button.grouphead", { type:"button", "aria-expanded": open ? "true" : "false" }, [
      DA.el("span.a", { text:"▾" }),
      DA.el("span.n", { text: g[0].topic || g[0].title }),
      DA.el("span.c", { text: g.length + " 回 / 未完 " +
        g.reduce(function(s,e){ return s + (e.tasksOpen || 0); }, 0) })
    ]);
    head.addEventListener("click", function(){
      openGroups[k] = box.getAttribute("data-open") === "false";
      box.setAttribute("data-open", openGroups[k] ? "true" : "false");
      head.setAttribute("aria-expanded", openGroups[k] ? "true" : "false");
    });
    box.appendChild(head);
    box.appendChild(DA.el("div.groupbody", null, [ recGrid(g) ]));
    host.appendChild(box);
  });
}

/* ---------- 横断ビュー：未完タスク ---------- */
function eachRecord(items, fn){
  items.forEach(function(e){
    var rec = DA.store.get(e.id);
    if(rec) fn(rec, e);
  });
}
function countTasks(items){
  var n = 0;
  items.forEach(function(e){ n += e.tasksOpen || 0; });
  return n;
}
function countIssues(items){
  var n = 0;
  items.forEach(function(e){ n += e.conflicts || 0; });
  return n;
}

function renderTaskView(host, items){
  var rows = [];
  eachRecord(items, function(rec, e){
    rec.tasks.forEach(function(t, i){
      if(!t.done) rows.push({ rec:rec, e:e, t:t, i:i });
    });
  });
  if(!rows.length){
    host.appendChild(DA.el("div.empty", null, [
      DA.el("p", { text:"未完のタスクはありません。" }) ]));
    return;
  }
  var list = DA.el("div.xlist");
  rows.forEach(function(r){
    var cb = DA.el("input", { type:"checkbox", "aria-label":"完了にする" });
    var row = DA.el("div.xrow");
    cb.addEventListener("change", function(){
      r.rec.tasks[r.i].done = cb.checked;
      try{ DA.store.save(r.rec); }catch(err){ alert(err.message); return; }
      row.classList.toggle("done", cb.checked);
      setTimeout(render, 350);
    });
    var sub = [ r.t.owner ? "担当：" + r.t.owner : "", r.t.due ? "期限：" + r.t.due : "",
                r.t.blocked_by ? "待ち：" + r.t.blocked_by : "" ].filter(Boolean).join("　");
    row.appendChild(cb);
    row.appendChild(DA.el("div.b", null, [
      DA.el("div.t", { text:r.t.text }),
      DA.el("div.s", null, [
        DA.el("a", { href:"record.html?id=" + encodeURIComponent(r.e.id), text:r.e.title }),
        DA.el("span", { text: DA.findMode(r.e.mode).tag }),
        DA.el("span", { text: DA.fmtDate(r.e.date) }),
        sub ? DA.el("span", { text:sub }) : null
      ])
    ]));
    list.appendChild(row);
  });
  host.appendChild(list);
}

/* ---------- 横断ビュー：未解決の論点 ---------- */
function renderIssueView(host, items){
  var rows = [];
  eachRecord(items, function(rec, e){
    rec.issues.forEach(function(iss){
      if(iss.status !== "合意") rows.push({ e:e, iss:iss });
    });
  });
  rows.sort(function(a,b){ return b.iss.importance - a.iss.importance; });
  if(!rows.length){
    host.appendChild(DA.el("div.empty", null, [
      DA.el("p", { text:"未解決の論点はありません。" }) ]));
    return;
  }
  var list = DA.el("div.xlist");
  rows.forEach(function(r){
    var url = "record.html?id=" + encodeURIComponent(r.e.id) + "&issue=" + encodeURIComponent(r.iss.id);
    list.appendChild(DA.el("div.xrow", null, [
      DA.el("span.im" + (r.iss.importance >= 4 ? ".hi" : ""), { text:"重要 " + r.iss.importance }),
      DA.el("div.b", null, [
        DA.el("div.t", { text:r.iss.label + (r.iss.unresolved ? " — " + r.iss.unresolved : "") }),
        DA.el("div.s", null, [
          DA.el("span.badge" + (r.iss.status === "対立" ? ".b-conflict" : ".b-hold"), { text:r.iss.status }),
          DA.el("a", { href:"record.html?id=" + encodeURIComponent(r.e.id), text:r.e.title }),
          DA.el("span", { text: DA.findMode(r.e.mode).tag }),
          DA.el("a", { href:url, text:"この項目で続きをつくる →" })
        ])
      ])
    ]));
  });
  host.appendChild(list);
}

/* ---------- サンプル ---------- */
function loadSample(){
  if(!DA.SAMPLE){
    DA.notice($("backupNotice"), "err", "サンプルを読み込めませんでした（samples/sample-record.js が見つかりません）。");
    return;
  }
  var rec = DA.normalize(JSON.parse(JSON.stringify(DA.SAMPLE)));
  rec._id = DA.newId();
  rec.meta.title = rec.meta.title + "（サンプル）";
  try{ DA.store.save(rec); }catch(err){
    DA.notice($("backupNotice"), "err", DA.esc(err.message)); return;
  }
  location.href = "record.html?id=" + encodeURIComponent(rec._id);
}

/* ---------- バックアップ ---------- */
$("expBtn").addEventListener("click", function(){
  var n = DA.store.list().length;
  if(!n){ DA.notice($("backupNotice"), "warn", "書き出す記録がありません。"); return; }
  DA.download("debate-records-" + DA.today() + ".json", DA.store.exportAll(), "application/json");
  DA.store.flag("backedUp", true);
  DA.notice($("backupNotice"), "ok", n + " 件を書き出しました。");
});

$("impBtn").addEventListener("click", function(){ $("importFile").click(); });
$("importFile").addEventListener("change", function(){
  var f = this.files && this.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var n = DA.store.importAll(String(r.result), "merge");
      DA.notice($("backupNotice"), "ok", n + " 件を読み込みました。");
      render();
    }catch(err){
      DA.notice($("backupNotice"), "err", "読み込めませんでした：" + DA.esc(err.message));
    }
  };
  r.readAsText(f, "utf-8");
  this.value = "";
});

/* ---------- 初期化 ---------- */
(function init(){
  var sel = $("fCat");
  DA.GROUPS.forEach(function(g){
    var og = document.createElement("optgroup");
    og.label = g.name;
    g.items.forEach(function(it){ og.appendChild(DA.el("option", { value:it.label, text:it.label })); });
    sel.appendChild(og);
  });

  /* モードのフィルタ。目的グループごとにまとめる */
  var msel = $("fMode");
  DA.MODE_GROUPS.forEach(function(g){
    var og = document.createElement("optgroup");
    og.label = g.name;
    DA.modesOfGroup(g.key).forEach(function(m){
      og.appendChild(DA.el("option", { value:m.key, text:m.label }));
    });
    msel.appendChild(og);
  });

  ["q","fMode","fCat","fSort","fGroup"].forEach(function(id){
    $(id).addEventListener("input", render);
    $(id).addEventListener("change", render);
  });

  /* 表示の切り替え（記録／未完タスク／未解決の論点） */
  [["v-rec","rec"],["v-task","task"],["v-issue","issue"]].forEach(function(p){
    $(p[0]).addEventListener("click", function(){
      view = p[1];
      ["v-rec","v-task","v-issue"].forEach(function(id){
        $(id).setAttribute("aria-selected", id === p[0] ? "true" : "false");
      });
      render();
    });
  });

  /* まとめ表示の設定は端末に残す */
  $("fGroup").checked = !!DA.store.flag("groupByTopic");
  $("fGroup").addEventListener("change", function(){
    DA.store.flag("groupByTopic", $("fGroup").checked);
  });

  render();
  /* カテゴリ色は CSS 変数から読むので、テーマが変わったら一覧を描き直す */
  DA.onTheme(render);

  var u = DA.store.usage();
  $("usage").textContent = "使用中：約 " + u.kb + " KB（目安の上限は 5,000 KB 前後）";

  if(DA.store.list().length && !DA.store.flag("backedUp")){
    DA.notice($("firstNotice"), "warn",
      "<b>記録はこの端末のブラウザにだけ保存されています。</b>" +
      "ブラウザの閲覧データを消すと一緒に消えます。ページ下部の「JSON で書き出す」で控えを取っておいてください。");
  }

  DA.boot("index");
})();
})();
</script>
<script src="assets/pwa.js"></script>
</body>
</html>
